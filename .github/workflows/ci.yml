name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validar versión publicada contra el tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"][1:]
          actual = Path("VERSION").read_text(encoding="utf-8").strip()
          if actual != expected:
              raise SystemExit(f"VERSION={actual} no coincide con tag v{expected}")
          PY

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxis de la aplicación
        run: python -m compileall -q app

      - name: Ejecutar pruebas unitarias disponibles
        run: |
          python -m unittest -v test_openclaw_session
          if [ -f test_tts.py ]; then
            python -m unittest -v test_tts
          fi
          if [ -f test_edge_tts.py ]; then
            python -m unittest -v test_edge_tts
          fi
